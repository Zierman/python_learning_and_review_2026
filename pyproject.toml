[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "python-learning-and-review-2026"
version = "0.1.0"
description = "Python learning and review exercises"
requires-python = ">=3.13"

[project.optional-dependencies]
dev = [
	"pre-commit>=3.8.0",
	"pytest>=8.0.0",
	"pylint>=3.0.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.mypy]
mypy_path = ["src"]

[tool.pylint.messages_control]
disable = ["missing-module-docstring"]
